name: build

permissions:
  contents: write

on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build_tests:
    name: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: win64

    steps:
      - name: Checkout codes
        uses: "actions/checkout@v4"

      - name: Setup
        run: |
          Invoke-WebRequest -Uri https://github.com/CNugteren/CLBlast/releases/download/1.7.0/CLBlast-1.7.0-windows-x64.7z -OutFile ${{ env.workspace }}CLBlast.7z
          7z x ${{ env.workspace }}CLBlast.7z -o${{ env.workspace }}
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2026.05.29/OpenCL-SDK-v2026.05.29-Win-x64.zip -OutFile ${{ env.workspace }}OpenCL-SDK.zip
          Expand-Archive -Path ${{ env.workspace }}OpenCL-SDK.zip -DestinationPath ${{ env.workspace }}

      - name: Build
        run: |
          cmake -S . -B build && cmake --build build --config Release -DCLBLAST_DIR=${{ env.workspace }}CLBlast-1.7.0-windows-x64 -DOPENCL_DIR=${{ env.workspace }}OpenCL-SDK-v2026.05.29-Win-x64

      - name: Build (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          export OpenMP_ROOT=$(brew --prefix)/opt/libomp
          cmake -S . -B build && cmake --build build --config Release

      - name: GoogleTest Tests
        run: |
          cd build
          ctest -V -C Release

      - name: Packaging
        run: |
          cd build
          cpack -C Release

      - name: Archive production artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact_name }}
          path: packages/*

  release:
    needs: [ build_tests ]
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: packages
        pattern: package-*
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/*
